name: Native Alice Bridge — Go tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/quasar-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/quasar-bridge/go.mod
      - name: Test bridge
        run: go test ./... -count=1 -timeout=120s
